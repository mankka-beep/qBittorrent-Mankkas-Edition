name: Idea / feature request
description: Suggest an improvement or a new idea for qBittorrent Mankka's Edition.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Good and creative ideas are very much appreciated! Please write in **English**.

  - type: textarea
    attributes:
      label: Your idea
      description: What would you like the program to do?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why would it be useful?
      description: What problem does it solve for you? How would you use it?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Anything else
      description: Examples, screenshots or sketches, how other programs do it, …
    validations:
      required: false
