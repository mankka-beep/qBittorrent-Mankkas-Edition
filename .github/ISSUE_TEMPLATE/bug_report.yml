name: Bug report
description: Something in qBittorrent Mankka's Edition doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting! Please write in **English**.

        - Check the user guide (`docs/mankkas-edition/USER_GUIDE.md` in this repository) first — it may explain the behaviour.
        - Make sure you're using the **newest release** of the edition.
        - **Don't report problems with this edition to the official qBittorrent project.**

  - type: input
    attributes:
      label: Edition version
      description: Shown in the window title and in Help → About.
      placeholder: "qBittorrent v1.1.0 Mankka's Edition"
    validations:
      required: true

  - type: input
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 24H2"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. First step
        2. Second step
        3. ...
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Does it also happen in the official qBittorrent?
      options:
        - "I don't know"
        - "No, only in this edition"
        - "Yes, also in the official qBittorrent"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Extra information
      description: Screenshots, Execution Log lines (View → Log), anything else that helps.
    validations:
      required: false
